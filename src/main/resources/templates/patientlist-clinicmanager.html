<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient List - Clinic Manager</title>
    <link rel="stylesheet" href="/css/patientlist-clinicmanager.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
<div class="background"></div>
<div class="clinicmanager-patientlist">

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="menu-icon">&#9776;</div>
                <img src="/images/UPMlogo.png" alt="UPM Logo" class="upm-logo">
                <h1>DentIS</h1>
            </div>
        </div>
        <div class="header-right">
            <div class="user-profile">
                <div class="user-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12Z" fill="currentColor"/>
                        <path d="M12 14C7.59 14 4 17.59 4 22H20C20 17.59 16.41 14 12 14Z" fill="currentColor"/>
                    </svg>
                </div>
                <span class="username" th:text="${currentUser != null ? currentUser.fullName + ' (' + currentUser.role.displayName + ')' : 'Guest'}">User</span>
                <div class="dropdown-icon">▼</div>
                <div class="user-dropdown">
                    <a href="/logout" class="dropdown-item">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="nav-menu">
                <ul>
                    <li class="nav-item">
                        <a href="/dashboard-clinicmanager" class="nav-link">
                            <img src="/images/home-icon.png" alt="Home" class="nav-icon">
                            <span>Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/requestlist-clinicmanager" class="nav-link">
                            <img src="/images/request-icon.png" alt="Request List" class="nav-icon">
                            <span>Request List</span>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="/patientlist-clinicmanager" class="nav-link">
                            <img src="/images/patient-icon.png" alt="Patient List" class="nav-icon">
                            <span>Patient List</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/assign-clinicmanager" class="nav-link">
                            <img src="/images/chart-icon.png" alt="Assign Advisers" class="nav-icon">
                            <span>Assign Advisers</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <section class="section">
                <div class="section-header">
                    <h2>Patient List</h2>
                    <div class="header-controls">
                        <input type="text" class="search-input" placeholder="Search patient...">
                        <a href="/admitting-clinicmanager" class="btn-add">+ Add Patient</a>
                    </div>
                </div>
                <!-- Section Tabs -->
                <div class="tab-bar">
                    <button class="tab-btn active" data-section="all">All <span class="tab-count" id="count-all"></span></button>
                    <button class="tab-btn" data-section="os">OS <span class="tab-count" id="count-os"></span></button>
                    <button class="tab-btn" data-section="endo">ENDO <span class="tab-count" id="count-endo"></span></button>
                    <button class="tab-btn" data-section="perio">PERIO <span class="tab-count" id="count-perio"></span></button>
                    <button class="tab-btn" data-section="resto">RESTO <span class="tab-count" id="count-resto"></span></button>
                    <button class="tab-btn" data-section="prostho">PROSTHO <span class="tab-count" id="count-prostho"></span></button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Chart Number</th>
                                <th>Patient Name</th>
                                <th>Contact Number</th>
                                <th>Email</th>
                                <th>Assigned Clinician</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="patient : ${patients}"
                                th:attr="data-section=${patient.serviceCode != null ? patient.serviceCode.toLowerCase() : 'unknown'}">
                                <td th:text="${patient.chartNo}"></td>
                                <td th:text="${patient.surname + ', ' + patient.firstName + (patient.middleInitial != null ? ' ' + patient.middleInitial + '.' : '')}"></td>
                                <td th:text="${patient.contactNumber}"></td>
                                <td th:text="${patient.email}"></td>
                                <td>
                                    <span th:if="${patient.assignedClinician != null}"
                                          class="clinician-link"
                                          th:data-name="${patient.assignedClinician.fullName}"
                                          th:data-email="${patient.assignedClinician.email}"
                                          th:data-student="${patient.assignedClinician.studentNumber}"
                                          th:data-year="${patient.assignedClinician.yearLevel}"
                                          th:data-clinician-id="${patient.assignedClinician.id}"
                                          th:data-patient-id="${patient.originalPatient != null ? patient.originalPatient.id : patient.id}"
                                          th:text="${patient.assignedClinician.fullName}"
                                          onclick="showClinicianModal(this)"></span>
                                    <span th:if="${patient.assignedClinician == null}">—</span>
                                </td>
                                <td><a th:href="@{/chartsview-clinicmanager/{id}(id=${patient.id})}" class="btn-view">View</a></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(patients)}">
                                <td colspan="6" style="text-align:center; color:#888;">No patients registered yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

<!-- Clinician Info Modal -->
<div id="clinicianModal" class="modal-overlay" onclick="closeClinicianModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeClinicianModal()">✕</button>
        <h3 id="modal-name"></h3>
        <div class="modal-details">
            <div class="modal-row"><span class="modal-label">Email</span><span id="modal-email"></span></div>
            <div class="modal-row"><span class="modal-label">Student No.</span><span id="modal-student"></span></div>
            <div class="modal-row"><span class="modal-label">Year Level</span><span id="modal-year"></span></div>
            <div class="modal-row"><span class="modal-label">Total Patients</span><span id="modal-total"></span></div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const clinicianPatientCounts = /*[[${clinicianPatientCounts}]]*/ {};
</script>

<script>
function showClinicianModal(el) {
    const name = el.dataset.name || '—';
    document.getElementById('modal-name').textContent = name;
    document.getElementById('modal-email').textContent = el.dataset.email || '—';
    document.getElementById('modal-student').textContent = el.dataset.student || '—';
    document.getElementById('modal-year').textContent = el.dataset.year || '—';
    const clinicianId = el.dataset.clinicianId;
    const total = clinicianId && clinicianPatientCounts[clinicianId] ? clinicianPatientCounts[clinicianId] : '—';
    document.getElementById('modal-total').textContent = total;
    document.getElementById('clinicianModal').style.display = 'flex';
}
function closeClinicianModal() {
    document.getElementById('clinicianModal').style.display = 'none';
}

document.querySelector('.menu-icon').onclick = function() {
    document.querySelector('.sidebar').classList.toggle('expanded');
};

document.querySelector('.user-profile').onclick = function(e) {
    e.stopPropagation();
    document.querySelector('.user-dropdown').classList.toggle('show');
};

document.addEventListener('click', function() {
    const dropdown = document.querySelector('.user-dropdown');
    if (dropdown.classList.contains('show')) dropdown.classList.remove('show');
});

document.querySelector('.user-dropdown').addEventListener('click', function(e) {
    e.stopPropagation();
});

/* ── Section tabs ── */
let activeSection = 'all';

function normSection(code) {
    if (!code) return 'unknown';
    const c = code.toLowerCase();
    return (c === 'cd' || c === 'rpd') ? 'prostho' : c;
}

function applyFilters() {
    const query = document.querySelector('.search-input').value.toLowerCase();
    document.querySelectorAll('tbody tr:not(.empty-row)').forEach(row => {
        const sec = normSection(row.dataset.section);
        const matchSection = activeSection === 'all' || sec === activeSection;
        const matchSearch  = row.textContent.toLowerCase().includes(query);
        row.style.display  = (matchSection && matchSearch) ? '' : 'none';
    });
}

function updateCounts() {
    const rows = Array.from(document.querySelectorAll('tbody tr:not(.empty-row)'));
    const totals = { all: rows.length, os: 0, endo: 0, perio: 0, resto: 0, prostho: 0 };
    rows.forEach(r => {
        const s = normSection(r.dataset.section);
        if (totals[s] !== undefined) totals[s]++;
    });
    Object.entries(totals).forEach(([k, v]) => {
        const el = document.getElementById('count-' + k);
        if (el) el.textContent = '(' + v + ')';
    });
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        activeSection = this.dataset.section;
        applyFilters();
    });
});

document.querySelector('.search-input').addEventListener('input', applyFilters);

updateCounts();
</script>

</body>
</html>
