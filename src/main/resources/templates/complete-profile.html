<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Complete Your Profile - DentIS</title>
    <link rel="stylesheet" href="/css/complete-profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="background"></div>

<div class="profile-wrapper">
    <div class="profile-card">

        <div class="card-header">
            <div class="logo">
                <img src="/images/UPMlogo.png" alt="UPM Logo">
                <h1>DentIS</h1>
            </div>
            <h2>Complete Your Profile</h2>
            <p>Please fill in your details to continue.</p>
            <div th:if="${currentUser != null}" class="role-badge"
                 th:text="${currentUser.role.displayName}">Role</div>
        </div>

        <div class="card-body">
            <form th:action="@{/complete-profile}" method="post">

                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="firstName" placeholder="e.g. Juan" required autofocus>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="lastName" placeholder="e.g. Dela Cruz" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Middle Name <span class="optional">(optional)</span></label>
                    <input type="text" name="middleName" placeholder="e.g. Santos">
                </div>

                <div th:if="${currentUser != null and currentUser.role.name() == 'CLINICIAN'}">
                    <div class="form-group">
                        <label>Student Number</label>
                        <input type="text" name="studentNumber" placeholder="e.g. 2022-01234" required>
                    </div>
                    <div class="form-group">
                        <label>Year Level</label>
                        <select name="yearLevel" required>
                            <option value="">-- Select Year --</option>
                            <option value="1st-Year">1st Year</option>
                            <option value="2nd-Year">2nd Year</option>
                            <option value="3rd-Year">3rd Year</option>
                            <option value="4th-Year">4th Year</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-save">Save &amp; Continue</button>
            </form>
        </div>

    </div>
</div>

</body>
</html>
