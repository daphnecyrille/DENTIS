<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clinical Oral Surgery - Odontectomy - DentIS</title>
    <link rel="stylesheet" href="/css/oralsurgery2-clinician.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/form-common.css?v=3">
</head>

<body>
<div class="background"></div>
<div class="oralsurgery2-page">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="menu-icon">&#9776;</div>
                <img src="/images/UPMlogo.png" alt="UPM Logo" class="upm-logo">
                <h1>DentIS</h1>
            </div>
        </div>
        <div class="header-right">
            <div class="user-profile">
                <div class="user-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12Z" fill="currentColor"/>
                        <path d="M12 14C7.59 14 4 17.59 4 22H20C20 17.59 16.41 14 12 14Z" fill="currentColor"/>
                    </svg>
                </div>
                <span class="username" th:text="${currentUser != null ? currentUser.fullName + ' (' + currentUser.role.displayName + ')' : 'Guest'}">User</span>
                <div class="dropdown-icon">&#9660;</div>
                <div class="user-dropdown">
                    <a href="/logout" class="dropdown-item">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="nav-menu">
                <ul>
                    <li class="nav-item">
                        <a href="/clinician-dashboard" class="nav-link">
                            <img src="/images/home-icon.png" alt="Home" class="nav-icon">
                            <span>Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/chartrequest-clinician" class="nav-link">
                            <img src="/images/request-icon.png" alt="Chart" class="nav-icon2">
                            <span>Chart Request</span>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="/patientlist-clinician" class="nav-link">
                            <img src="/images/patient-icon.png" alt="Patient" class="nav-icon">
                            <span>Patient List</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/evaluations-clinician" class="nav-link" style="position:relative;">
                            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="4" width="14" height="17" rx="2" stroke="#333" stroke-width="2"/><path d="M9 4V3h6v1" stroke="#333" stroke-width="2" stroke-linecap="round"/><path d="M8.5 12.5l2.2 2.2 4.8-4.8" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <span>Evaluations</span>
                            <b th:if="${currentUser != null and @notificationService.newEvaluationCount(currentUser) > 0}" th:text="${@notificationService.newEvaluationCount(currentUser)}"
                               style="position:absolute; top:2px; right:6px; min-width:18px; height:18px; padding:0 5px; box-sizing:border-box; border-radius:9px; background:#c0392b; color:white; font-size:11px; font-weight:700; line-height:18px; text-align:center;">1</b>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">


            <h2 class="page-title">Clinical Oral Surgery</h2>
            <div th:if="${chart.status != null and chart.status.name() == 'REVISE' and chart.revisionReason != null and !#strings.isEmpty(chart.revisionReason)}"
                 style="background:#fff3cd; border-left:5px solid #e6a817; padding:14px 24px; margin:0 0 28px 0; font-family:'Poppins',sans-serif; border-radius:6px;">
                <strong style="font-size:13px; color:#856404; display:block; margin-bottom:4px;">Revision Required</strong>
                <p style="margin:0; font-size:13px; color:#533f03;" th:text="${chart.revisionReason}"></p>
            </div>

            <div class="form-card">
                <!-- Back to Charts (top-left) + "Changes saved" popup -->
                <a th:if="${currentUser != null and currentUser.role.name() == 'CLINIC_MANAGER'}" th:href="@{/chartsview-clinicmanager/{id}(id=${chart.patient.id})}" class="back-arrow" title="Back to Charts"><span class="back-arrow-icon">&larr;</span> Back to Charts</a>
                <a th:if="${currentUser != null and currentUser.role.name() == 'FACULTY'}" th:href="@{/chartsview-faculty/{id}(id=${chart.patient.id})}" class="back-arrow" title="Back to Charts"><span class="back-arrow-icon">&larr;</span> Back to Charts</a>
                <a th:if="${currentUser == null or currentUser.role.name() == 'CLINICIAN'}" th:href="@{/chartsview-clinician/{id}(id=${chart.patient.id})}" class="back-arrow" title="Back to Charts"><span class="back-arrow-icon">&larr;</span> Back to Charts</a>
                <div th:if="${param.saved != null}" class="saved-toast" role="status">
                    <span class="saved-toast-icon">&#10003;</span>
                    <span>Changes saved</span>
                    <button type="button" class="saved-toast-close" aria-label="Close" onclick="this.parentNode.remove()">&times;</button>
                </div>
                <div class="form-banner">Odontectomy Case Patient Workup Form</div>

                <form th:action="@{/oralsurgery2-clinician/{id}(id=${chart.id})}" th:object="${chart}" method="post">
                <div class="form-body">

                    <!-- Chart No. -->
                    <div class="form-group">
                        <label>Chart No.</label>
                        <input type="text" th:value="${chart.chartNo}" class="input-medium" readonly>
                    </div>

                    <!-- Clinician + Date -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>Clinician</label>
                            <input type="text" th:value="${chart.clinician != null ? chart.clinician.fullName : ''}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" th:field="*{odontectomyDate}" class="date-picker" th:readonly="${viewOnly}">
                        </div>
                    </div>

                    <!-- Patient Name -->
                    <div class="form-group">
                        <label>Patient Name</label>
                        <div class="split-input">
                            <input type="text" th:value="${chart.patient.surname}" readonly>
                            <input type="text" th:value="${chart.patient.firstName}" class="input-wide" readonly>
                            <input type="text" th:value="${chart.patient.middleInitial}" class="input-narrow" readonly>
                        </div>
                    </div>

                    <!-- Age, Sex -->
                    <div class="form-row row-small">
                        <div class="form-group">
                            <label>Age</label>
                            <input type="text" th:value="${chart.patient.age}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Sex</label>
                            <input type="text" th:value="${chart.patient.sex}" readonly>
                        </div>
                    </div>

                    <!-- Chief Complaint -->
                    <div class="form-group">
                        <label>Chief Complaint</label>
                        <textarea th:field="*{chiefComplaint}" rows="2" th:readonly="${viewOnly}"></textarea>
                    </div>

                    <!-- History of Present Illness -->
                    <div class="form-group">
                        <label>History of Present Illness</label>
                        <textarea th:field="*{historyOfPresentIllness}" rows="2" th:readonly="${viewOnly}"></textarea>
                    </div>

                    <!-- Clinical Findings -->
                    <div class="form-group">
                        <label>Clinical Findings</label>
                        <textarea th:field="*{clinicalFindings}" rows="2" th:readonly="${viewOnly}"></textarea>
                    </div>

                    <!-- Radiographic Findings + Classification of Impaction -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>Radiographic Findings</label>
                            <textarea th:field="*{odontectomyRadiographicFindings}" rows="3" th:readonly="${viewOnly}"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Classification of Impaction</label>
                            <textarea th:field="*{classificationOfImpaction}" rows="3" th:readonly="${viewOnly}"></textarea>
                        </div>
                    </div>

                    <!-- Diagnosis & Treatment Plan -->
                    <div class="form-group">
                        <label>Diagnosis &amp; Treatment Plan</label>
                        <textarea th:field="*{diagnosisTreatmentPlan}" rows="4" th:readonly="${viewOnly}"></textarea>
                    </div>

                    <!-- Patient Workup Checklist -->
                    <div class="checklist-section">
                        <h3 class="checklist-title">Patient Workup Checklist</h3>
                        <div class="checklist-grid">
                            <label class="checkbox-label"><input type="checkbox" th:field="*{hasAsChart}" th:disabled="${viewOnly}"> AS Chart</label>
                            <div></div>
                            <label class="checkbox-label"><input type="checkbox" th:field="*{hasIntraoralPhoto}" th:disabled="${viewOnly}"> Intraoral Photo/s</label>
                            <div></div>
                            <div class="checklist-inline">
                                <label class="checkbox-label"><input type="checkbox" th:field="*{hasRadiograph}" th:disabled="${viewOnly}"> Radiograph</label>
                                <input type="text" th:field="*{radiographType}" class="input-inline" placeholder="Indicate what type" th:readonly="${viewOnly}">
                            </div>
                            <div></div>
                            <label class="checkbox-label"><input type="checkbox" th:field="*{hasImpression}" th:disabled="${viewOnly}"> Impression/Diagnostic Cast</label>
                            <div></div>
                            <div class="checklist-inline">
                                <label class="checkbox-label"><input type="checkbox" th:field="*{hasOtherDiagnosticAids}" th:disabled="${viewOnly}"> Other supplemental diagnostic aids</label>
                                <input type="text" th:field="*{otherDiagnosticAids}" class="input-inline" th:readonly="${viewOnly}">
                            </div>
                            <div></div>
                        </div>
                    </div>

                    <!-- Patient Workup Checked By (Clinical OS Faculty): the approving faculty's name, filled in on approval -->
                    <div class="form-group os2-checked">
                        <label>Patient Workup Checked By <span class="os2-sub">(Clinical OS Faculty)</span></label>
                        <input type="text" readonly
                               th:value="${chart.facultySignedBy != null ? chart.facultySignedBy + (chart.facultySignedAt != null ? ' · ' + #temporals.format(chart.facultySignedAt, 'MMM d, yyyy') : '') : ''}"
                               th:placeholder="${chart.status.name() == 'SUBMITTED' and currentUser != null and currentUser.role.name() == 'FACULTY' and chart.faculty != null and chart.faculty.id == currentUser.id ? 'Your name is filled in when you approve' : 'Filled in when the faculty approves'}">
                    </div>

                    <!-- Save -->
                    <div class="form-actions" th:if="${!viewOnly}">
                        <button type="submit" class="btn-submit">Save</button>
                    </div>

                </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script>
document.querySelectorAll('.select-input').forEach(function(sel) {
    sel.addEventListener('change', function() {
        this.classList.toggle('selected', !!this.value);
    });
});

/* empty Date: today (the clinician can still change it) */
(function () {
    var d = document.querySelector('input[name="odontectomyDate"]');
    if (!d || d.readOnly || d.value) return;
    var n = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    d.value = n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate());
})();

document.querySelector('.menu-icon').onclick = function() {
    document.querySelector('.sidebar').classList.toggle('expanded');
};

document.querySelector('.user-profile').onclick = function(e) {
    e.stopPropagation();
    document.querySelector('.user-dropdown').classList.toggle('show');
};

document.addEventListener('click', function() {
    const dropdown = document.querySelector('.user-dropdown');
    if (dropdown.classList.contains('show')) dropdown.classList.remove('show');
});

document.querySelector('.user-dropdown').addEventListener('click', function(e) {
    e.stopPropagation();
});
</script>

<script th:inline="javascript">var VIEW_ONLY = /*[[${viewOnly == true}]]*/ false;</script>
<script th:inline="none">
/* ── Warn before leaving with unsaved changes ──
   Any edit (typing, a chart mark, a missing tooth, a symbol, adding/removing a row or chart) marks the page as changed.
   Leaving by a link, the sidebar, reload or closing the tab then asks for confirmation. Saving clears the flag. */
(function() {
    if (typeof VIEW_ONLY !== 'undefined' && VIEW_ONLY) return;
    var dirty = false;
    var EDIT_TARGETS = [
        '.box-spot', '.tooth-btn', '.col-x-btn', '.col-x-btn-c', '.sym-btn', 'canvas',
        '.pf3-site', '.pi-input', '.star-cell', '.btn-row', '.btn-pm', '.btn-star',
        '.chart-tab-add', '.tab-remove'
    ].join(',');
    function markDirty() { dirty = true; }
    document.addEventListener('input',  markDirty, true);
    document.addEventListener('change', markDirty, true);
    document.addEventListener('click', function(e) {
        if (e.target.closest && e.target.closest(EDIT_TARGETS)) markDirty();
    }, true);
    document.querySelectorAll('form').forEach(function(f) {
        f.addEventListener('submit', function() { dirty = false; });
    });
    window.addEventListener('beforeunload', function(e) {
        if (!dirty) return;
        e.preventDefault();
        e.returnValue = '';
    });
})();
</script>
<script src="/js/textarea-min-size.js"></script>
<script src="/js/sidebar-hover.js?v=3"></script>
<script src="/js/date-click.js"></script>
</body>
</html>
